name: Compact Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'scripts/compact-firestore-rules.py'
      - '.github/workflows/compact-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compact authoritative rules
        run: python scripts/compact-firestore-rules.py

      - name: Enforce production size budget
        run: |
          bytes=$(wc -c < firestore.rules)
          lines=$(wc -l < firestore.rules)
          echo "firestore.rules: ${bytes} bytes, ${lines} lines"
          test "$bytes" -lt 150000
          test ! -f firestore.indexes.json

      - name: Verify critical security boundaries
        run: |
          grep -q "'portal.access' in currentStaff().permissions" firestore.rules
          grep -q "staffPermission('appeals.review')" firestore.rules
          grep -q "staffPermission('claims.review')" firestore.rules
          grep -q "staffPermission('payroll.approve')" firestore.rules
          grep -q "staffPermission('internalAffairs.manage')" firestore.rules
          grep -q "staffPermission('pr.approve')" firestore.rules
          grep -q "resource.data.createdByUid != request.auth.uid" firestore.rules
          grep -q "resource.data.requestedByUid != request.auth.uid" firestore.rules
          grep -Fq 'match /{document=**}' firestore.rules
          grep -Fq 'allow read, write: if false;' firestore.rules
          ! grep -q 'backgroundCheckApprovals' firestore.rules
          ! grep -q 'commandBackgroundChecks' firestore.rules

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Compile with Firestore emulator
        env:
          CI: 'true'
        run: firebase emulators:exec --only firestore --project demo-cognitus-solutions "echo FIRESTORE_RULES_COMPILE_OK"

      - name: Commit compact production rules
        run: |
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.rules docs/FIRESTORE_COMPACTION.md
          if git diff --cached --quiet; then
            echo 'Rules already compact.'
            exit 0
          fi
          git commit -m 'Compact Firestore rules for production deployment'
          git push
