name: Validate Professional Contrast V40

on:
  push:
    paths:
      - "src/professionalContrastV40.css"
      - "src/professionalContrastV40.js"
      - "src/promotionalAccessV26.js"
      - "scripts/validate-professional-contrast-v40.mjs"
      - ".github/workflows/validate-professional-contrast-v40.yml"
  pull_request:
    paths:
      - "src/professionalContrastV40.css"
      - "src/professionalContrastV40.js"
      - "src/promotionalAccessV26.js"
      - "scripts/validate-professional-contrast-v40.mjs"
      - ".github/workflows/validate-professional-contrast-v40.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V40 JavaScript syntax
        run: node --check src/professionalContrastV40.js
      - name: Validate contrast contract
        run: node scripts/validate-professional-contrast-v40.mjs
