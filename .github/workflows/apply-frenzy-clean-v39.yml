name: Apply Frenzy Startup V39

on:
  push:
    branches:
      - "agent/fix-frenzy-clean-v39"
    paths:
      - "scripts/apply-frenzy-clean-v39.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-frenzy-clean-v39
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Frenzy startup ordering repair
        run: node scripts/apply-frenzy-clean-v39.mjs
      - name: Commit Frenzy startup repair
        run: |
          if git diff --quiet -- src/frenzyV35.js; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "Executive_Eagle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frenzyV35.js
          git commit -m "Fix Frenzy clean initialization V39"
          git push origin HEAD:agent/fix-frenzy-clean-v39
