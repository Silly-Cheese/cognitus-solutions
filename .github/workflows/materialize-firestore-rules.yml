name: Materialize Full Firestore Rules

on:
  push:
    branches:
      - agent/full-firestore-rules

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/full-firestore-rules
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build complete rules
        run: |
          node scripts/build-firestore-v19.mjs
          node scripts/build-promotional-rules-v26.mjs
          cp firestore.v19.rules firestore.rules

      - name: Remove one-time materializer and commit full rules
        run: |
          rm .github/workflows/materialize-firestore-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/materialize-firestore-rules.yml
          git commit -m "Materialize full V19+V26 Firestore rules"
          git push origin HEAD:agent/full-firestore-rules
