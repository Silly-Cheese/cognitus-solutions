name: Upgrade Executive Registry Rules

on:
  push:
    paths:
      - 'scripts/upgrade-executive-registry-rules.py'
      - '.github/workflows/upgrade-executive-registry-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply executive registry management rules
        run: python scripts/upgrade-executive-registry-rules.py
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Compile rules with Firestore emulator
        run: |
          set -o pipefail
          timeout 45s firebase emulators:start --only firestore --project demo-cognitus --config firebase.json > /tmp/firestore-emulator.log 2>&1 &
          pid=$!
          sleep 15
          if grep -Eqi 'Error:.*firestore\.rules|Unexpected|Compilation error|Invalid rules|syntax error' /tmp/firestore-emulator.log; then
            cat /tmp/firestore-emulator.log
            kill $pid || true
            exit 1
          fi
          kill $pid || true
          wait $pid || true
          cat /tmp/firestore-emulator.log
      - name: Verify executive management boundaries
        run: |
          grep -F "EXECUTIVE_REGISTRY_MANAGEMENT_V2" firestore.rules
          grep -F "allow update: if commandOwner()" firestore.rules
          grep -F "allow delete: if commandOwner();" firestore.rules
          grep -F "!exists(staffAccessPath(uid))" firestore.rules
          test $(wc -c < firestore.rules) -lt 200000
      - name: Commit authoritative rules
        run: |
          if git diff --quiet -- firestore.rules; then
            echo 'Executive registry rules already applied.'
            exit 0
          fi
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'Enable executive account and organization management'
          git push
