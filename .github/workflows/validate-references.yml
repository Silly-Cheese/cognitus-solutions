name: Validate References and Functions
on:
  push:
    branches:
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  reference-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/referenceRequestsV1.js
      - run: node --check src/app.js
      - run: node --check src/navigationEnhancements.js
      - run: node --check functions/index.js
      - run: node --test tests/referenceSmoke.test.mjs

  reference-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests --no-audit --no-fund
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-cognitus --config firebase.json "node --test tests/referenceRules.test.mjs"
