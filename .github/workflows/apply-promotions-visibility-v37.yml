name: Apply Promotions Visibility V37

on:
  push:
    branches:
      - "agent/promotions-visibility-v37"
    paths:
      - "scripts/apply-promotions-visibility-v37.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotions-visibility-v37
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize V37 production bootstrap
        run: node scripts/apply-promotions-visibility-v37.mjs
      - name: Commit generated production wiring
        run: |
          if git diff --quiet -- index.html src/navigationEnhancements.js; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "Executive_Eagle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/navigationEnhancements.js
          git commit -m "Wire Promotions Visibility V37 into production"
          git push origin HEAD:agent/promotions-visibility-v37
