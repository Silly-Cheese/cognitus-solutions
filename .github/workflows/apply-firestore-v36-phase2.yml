name: Apply Firestore V36 Phase 2

on:
  push:
    branches:
      - "agent/firestore-rules-v36-phase-build"
    paths:
      - "scripts/apply-firestore-v36-phase2.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/firestore-rules-v36-phase-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply phase 2 transformation
        run: node scripts/apply-firestore-v36-phase2.mjs
      - name: Commit generated rules
        run: |
          if git diff --quiet -- firestore.rules scripts/build-promotional-rules-v26.mjs; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "Executive_Eagle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules scripts/build-promotional-rules-v26.mjs
          git commit -m "Firestore V36 phase 2: complete entitlement and default-deny rules"
          git push origin HEAD:agent/firestore-rules-v36-phase-build
