name: Repair Firestore Rules Syntax

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-firestore-rules-syntax.py'
      - '.github/workflows/repair-firestore-rules-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Repair and structurally validate rules
        run: python scripts/repair-firestore-rules-syntax.py

      - name: Enforce size and security invariants
        run: |
          bytes=$(wc -c < firestore.rules)
          lines=$(wc -l < firestore.rules)
          echo "firestore.rules: ${bytes} bytes, ${lines} lines"
          test "$bytes" -lt 140000
          test ! -f firestore.indexes.json
          grep -q "'portal.access' in currentStaff().permissions" firestore.rules
          grep -q "staffPermission('appeals.review')" firestore.rules
          grep -q "staffPermission('claims.review')" firestore.rules
          grep -Fq 'match /{document=**}' firestore.rules
          grep -Fq 'allow read, write: if false;' firestore.rules

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Start Firestore emulator and scan compiler log
        env:
          CI: 'true'
        run: |
          firebase emulators:exec --only firestore --project demo-cognitus-solutions "echo FIRESTORE_EMULATOR_STARTED"
          if grep -Eiq 'error.*(rules|compil|parse)|rules.*error|syntax error' firestore-debug.log; then
            echo 'Firestore debug log contains a rules/compiler error:'
            grep -Ein 'error.*(rules|compil|parse)|rules.*error|syntax error' firestore-debug.log || true
            exit 1
          fi

      - name: Commit repaired authoritative rules
        run: |
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.rules
          if git diff --cached --quiet; then
            echo 'Rules already repaired.'
            exit 0
          fi
          git commit -m 'Repair compacted Firestore rules syntax'
          git push
