name: Deploy Cognitus References (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-REFERENCES to authorize a production deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-REFERENCES'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COGNITUS_SOLUTIONS }}
      - name: Validate sources
        run: |
          node --check functions/index.js
          node --check src/referenceRequestsV1.js
          node --test tests/referenceSmoke.test.mjs
      - name: Install Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Deploy references codebase and authoritative rules
        run: npx --yes firebase-tools@latest deploy --only functions:references,firestore:rules --project cognitus-solutions --non-interactive
