name: Harden Staff Command Generation 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-staff-command-generation-2.yml'
      - 'scripts/harden-staff-command-generation-2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden rules
        run: python scripts/harden-staff-command-generation-2.py

      - name: Verify hardened helper
        run: |
          grep -q 'function commandG2CanManageTicket' firestore.rules
          python scripts/harden-staff-command-generation-2.py

      - name: Commit hardened rules
        run: |
          if git diff --quiet; then
            echo 'Generation 2 Command rules are already hardened.'
            exit 0
          fi
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'Harden Staff Command generation 2 ticket authority'
          git push
