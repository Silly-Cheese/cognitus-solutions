name: Validate Navigation V22

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  navigation-v22:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check navigation JavaScript syntax
        run: node --check src/navigationShellV20.js
      - name: Run Navigation V22 isolation checks
        run: node scripts/validate-navigation-v22.mjs
