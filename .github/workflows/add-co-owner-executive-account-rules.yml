name: Add Co-Owner and Executive Account Rules

on:
  push:
    paths:
      - 'scripts/add-co-owner-executive-account-rules.py'
      - '.github/workflows/add-co-owner-executive-account-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply Co-Owner and executive rules
        run: python scripts/add-co-owner-executive-account-rules.py
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Compile rules with Firestore emulator
        run: |
          set -o pipefail
          timeout 45s firebase emulators:start --only firestore --project demo-cognitus --config firebase.json > /tmp/firestore-emulator.log 2>&1 &
          pid=$!
          sleep 15
          if grep -Eqi 'Error:.*firestore\.rules|Unexpected|Compilation error|Invalid rules|syntax error' /tmp/firestore-emulator.log; then
            cat /tmp/firestore-emulator.log
            kill $pid || true
            exit 1
          fi
          kill $pid || true
          wait $pid || true
          cat /tmp/firestore-emulator.log
      - name: Verify authority boundaries
        run: |
          grep -F "function commandOwner()" firestore.rules
          grep -F "currentStaff().rank == 'co-owner'" firestore.rules
          grep -F "currentStaff().rank == 'chief-officer'" firestore.rules
          grep -F "'accounts.read.all'" firestore.rules
          grep -F "allow read, write: if false;" firestore.rules
          ! grep -F 'commandBackgroundChecks' firestore.rules
          test $(wc -c < firestore.rules) -lt 190000
      - name: Commit authoritative rules
        run: |
          if git diff --quiet -- firestore.rules; then
            echo 'Rules upgrade already applied.'
            exit 0
          fi
          git config user.name 'Cognitus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'Add Co-Owner and executive all-account authority'
          git push
