name: Validate Cognitus

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check production JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/navigationEnhancements.js
          node --check src/controlsV4.js
          node --check src/assessmentV4.js
          node --check src/profileV5.js
          node --check src/reportAssessmentV7.js
          node --check src/reportAccessV8.js
          node --check src/ownerReportGrantsV9.js
          node --check src/employerStatusV10.js
          node --check src/employerWorkspaceV11.js
          node --check src/employerHubFixV12.js
          node --check src/interfacePolishV13.js
          node --check src/comprehensiveReportV15.js
          node --check src/employerPeopleSearchV18.js
          node --check src/foundationCoreV19.js
          node --check scripts/build-firestore-v19.mjs
          node --check scripts/validate-foundation-v19.mjs

      - name: Run Profile V5 regression checks
        run: node scripts/validate.mjs

      - name: Run Navigation V6 regression checks
        run: node scripts/validate-navigation-v6.mjs

      - name: Run assessment persistence regression checks
        run: node scripts/validate-assessment-save.mjs

      - name: Run report assessment visualization checks
        run: node scripts/validate-report-assessment.mjs

      - name: Run controlled report access checks
        run: node scripts/validate-report-access-v8.mjs

      - name: Run Owner direct report grant checks
        run: node scripts/validate-owner-report-grants-v9.mjs

      - name: Run Employer Status V10 checks
        run: node scripts/validate-employer-status-v10.mjs

      - name: Run comprehensive report V15 checks
        run: node scripts/validate-comprehensive-report-v15.mjs

      - name: Run Performance V16 checks
        run: node scripts/validate-performance-v16.mjs

      - name: Run Employer Hub Recognition V17 checks
        run: node scripts/validate-employer-recognition-v17.mjs

      - name: Run Employer People Search V18 checks
        run: node scripts/validate-employer-people-search-v18.mjs

      - name: Run Foundation V19 checks
        run: node scripts/validate-foundation-v19.mjs

      - name: Build Foundation V19 Firestore rules
        run: node scripts/build-firestore-v19.mjs

      - name: Compile Foundation V19 Firestore rules in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-cognitus --config firebase.v19.json "echo Foundation V19 Firestore rules compiled"
