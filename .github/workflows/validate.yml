name: Validate Cognitus

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check production JavaScript syntax
        run: node --check src/app.js

      - name: Run secure V2 regression checks
        run: node scripts/validate.mjs
