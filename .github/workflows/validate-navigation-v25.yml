name: Validate Navigation V25

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  navigation-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check V25 JavaScript syntax
        run: node --check src/navigationMobileV25.js
      - name: Run Navigation V25 dedicated shell checks
        run: node scripts/validate-navigation-v25.mjs
