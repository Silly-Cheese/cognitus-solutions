name: Validate Navigation V24

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  navigation-v24:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check navigation state syntax
        run: node --check src/navigationStateV23.js
      - name: Run Navigation V24 mobile toggle checks
        run: node scripts/validate-navigation-v24.mjs
